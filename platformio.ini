; Firmware "control T60" para el T-Embed CC1101 Plus (collar del perro de Daniel). Plan: control-firmware.md.
; Pruebas host:  ~/.platformio/penv/bin/pio test -e native   (vectores: python3 -I tools/gen_vectors.py)
; Build:         ~/.platformio/penv/bin/pio run -e tembed
; Flash:         ~/.platformio/penv/bin/pio run -e tembed -t upload   (confirmar antes: borra el firmware actual)

[platformio]
default_envs = tembed

[env:tembed]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
test_ignore = *
extra_scripts = pre:tools/build_env.py   ; T60_ID desde .env (no versionado), versión git, no compila si está atrasado
lib_deps =
    lovyan03/LovyanGFX@1.2.30
    lvgl/lvgl@9.5.0
    h2zero/NimBLE-Arduino@2.3.7
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DALLOW_SHOCK=1   ; techo duro: permite el interruptor `shock on|off` (serial, persistente en NVS)
    -DLV_CONF_INCLUDE_SIMPLE
    '-DLV_CONF_KCONFIG_EXTERNAL_INCLUDE="lv_kconfig_stub.h"'
    -I include

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -DT60_ID=0x1234   ; ID de ejemplo (= TEST_ID de tools/gen_vectors.py)
